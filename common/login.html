<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OSRS</title>
        <link rel="stylesheet" href="/core-ui/osrs-common.css">
        <script>
        window.onload = () => {
            const redir = new URL(window.location.href).searchParams.get("redir");
            const elem = document.querySelector("input[name='redirect']");
            if(!redir) elem.remove();
            else elem.value = redir;
        }
        </script>
    </head>

    <body>
        <h1 class="osrs-title">{trs:Log In}</h1>
        <form action="/login" method="POST">
            <fieldset class="login-form">
                <legend>{trs:Account}</legend>
                <input name="redirect" type="hidden">
                <label>{trs:Username:}
                    <input name="name" type="text" autocomplete="username" required>
                </label>
                <label>{trs:Password:}
                    <input name="password" type="password" autocomplete="current-password" required>
                </label>
                <button class="user-thing" type="submit">
                    <img src="/core-ui/res/user-regular-full.svg" width="32" height="32">
                    <span>{trs:Log In}</span>
                </button>
            </fieldset>
        </form>
    </body>
</html>
