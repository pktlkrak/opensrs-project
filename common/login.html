<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSRS - Login</title>
    <script>
        window.onload = () => {
            const redir = new URL(window.location.href).searchParams.get("redir");
            const elem = document.querySelector("input[name='redirect']");
            if(!redir) elem.remove();
            else elem.value = redir;
        }
    </script>
</head>
<body>
    <form action="/login" method="POST" onsubmit="submit">
        <input name="redirect" type="text" hidden>
        <label>Username: 
            <input name="name" type="text">
        </label>
        <label>Password: 
            <input name="password" type="password">
        </label>
        <input value="Login" type="submit">
    </form>
</body>
</html>
